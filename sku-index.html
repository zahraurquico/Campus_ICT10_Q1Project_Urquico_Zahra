<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harvest &amp; Co. | SKU Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">

    <style>
        :root {
            --green: #2d4a36;
            --cream: #f5efe0;
            --light: #fffaee;
            --sage: #a9b59c;
            --gold: #d4a94f;
            --brown: #5b4a3a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--brown);
            background-color: #c99a5b;
            background-image: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.2) 0px,
                rgba(0, 0, 0, 0.2) 2px,
                transparent 2px,
                transparent 150px
            );
        }

        header {
            position: relative;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 8px 22px;
            background: var(--green);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.35);
        }

        header img {
            display: block;
            height: 58px;
        }

        header h1 {
            margin: 0;
            text-align: center;
            text-transform: uppercase;
            font-family: Anton, Impact, sans-serif;
            font-size: 34px;
            font-weight: normal;
            color: var(--cream);
        }

        #menuButton {
            justify-self: end;
            padding: 8px;
            border: none;
            background: none;
            cursor: pointer;
        }

        #menuButton span {
            display: block;
            width: 36px;
            height: 6px;
            margin: 6px 0;
            border-radius: 4px;
            background: var(--cream);
        }

        #menu {
            position: absolute;
            top: 72px;
            right: 18px;
            z-index: 5;
            min-width: 200px;
            padding: 8px;
            border-radius: 8px;
            background: var(--cream);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        #menu a {
            display: block;
            padding: 10px 14px;
            text-transform: uppercase;
            text-decoration: none;
            font-family: Anton, Impact, sans-serif;
            font-size: 20px;
            color: var(--green);
        }

        .page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: start;
            max-width: 1000px;
            margin: 0 auto;
            padding: 34px 20px 56px;
        }

        .card {
            padding: 18px 22px 24px;
            border-radius: 6px;
            background: var(--cream);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin: 0;
            text-transform: uppercase;
            font-family: Anton, Impact, sans-serif;
            font-size: 42px;
            font-weight: normal;
            color: var(--green);
        }

        .desc {
            margin: 2px 0 14px;
            font-size: 11px;
            color: #7a6e60;
        }

        label {
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-family: Anton, Impact, sans-serif;
            font-size: 22px;
            color: var(--green);
        }

        input,
        select {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--sage);
            border-radius: 8px;
            background: var(--light);
            color: var(--brown);
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: 21px;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        .select-box {
            position: relative;
            flex: 1;
        }

        .select-box::after {
            content: "\25BC";
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--gold);
            pointer-events: none;
        }

        .category-row {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 18px;
        }

        .category-row label {
            margin: 0;
        }

        .field {
            margin-bottom: 18px;
        }

        .button {
            padding: 8px 32px;
            border: 2px solid var(--green);
            border-radius: 6px;
            background: var(--green);
            color: var(--cream);
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: 21px;
            cursor: pointer;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.25);
        }

        .outline-button {
            background: var(--light);
            color: var(--green);
        }

        .center {
            margin-top: 12px;
            text-align: center;
        }

        .error {
            min-height: 22px;
            margin: 10px 0 0;
            color: #b04a33;
        }

        .message {
            min-height: 22px;
            margin: 10px 0 0;
            color: var(--green);
        }

        .preview {
            padding: 14px 8px;
            border: 3px dashed var(--sage);
            border-radius: 8px;
            background: var(--light);
            text-align: center;
            font-family: Anton, Impact, sans-serif;
            font-size: 40px;
            color: var(--brown);
        }

        .empty {
            color: #c2b9a6;
        }

        @media (max-width: 760px) {
            .page {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 22px;
            }

            header img {
                height: 46px;
            }
        }
    </style>
</head>
<body>
    <header>
        <a href="sku-index.html">
            <img src="logo.png" alt="Harvest &amp; Co.">
        </a>

        <h1>SKU Generator</h1>

        <button id="menuButton" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="menu" hidden>
            <a href="sku-index.html">SKU Generator</a>
            <a href="receipt-index.html">Receipt Generator</a>
        </nav>
    </header>

    <main class="page">

        <section class="card">
            <h2>NEW ITEM</h2>
            <p class="desc">Input details to create a product SKU.</p>

            <div class="category-row">
                <label for="category">Category</label>

                <div class="select-box">
                    <select id="category"> 
                    <option value="FP">Fresh Produce</option>
                    <option value="FT">Fruits</option>
                    <option value="AP">Animal Produce</option>
                    <option value="CP">Condiments & Preserves</option>
                    <option value="BG">Baked Goods</option>
                    <option value="GP">Grains & Pantry</option>
                    <option value="HS">Herbs & Spices</option>
                    </select>
                </div>
            </div>

            <div class="input-field">
                <label for="name">Product Name</label>
                <input type="text" id="name" placeholder="Enter product name">
            </div>

            <div class="input-field">
                <label for="stock">Stock Quantity</label>
                <input type="number" id="stock" placeholder="Enter stock quantity">
            </div>

            <div class="center">
                <button class="button" onclick="generateSku()">Generate SKU</button>
            </div>

            <p class="error" id="error"></p>

        </section>

        <section class="card">
            <h2>SKU Preview</h2>
            <p class="desc">Generated SKU will appear here</p>

            <div class="preview empty" id="preview">CAT-NAM-001</div>

            <p class="message" id="message"></p>
        </section>
    </main>
    
    <script src="sku-main.js"></script>
</body>
</html>
