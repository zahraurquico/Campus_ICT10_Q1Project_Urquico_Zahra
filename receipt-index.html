<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Harvest &amp; Co. | Receipt Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        :root {
            --green: #2d4a36;
            --cream: #f5efe0;
            --light: #fffaee;
            --sage: #a9b59c;
            --gold: #d4a94f;
            --red: #c27b66;
            --brown: #5b4a3a;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: var(--brown);
            background-color: #c99a5b;
            background-image: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.2) 0px,
                rgba(0, 0, 0, 0.2) 2px,
                transparent 2px,
                transparent 150px
            );
        }

        header {
            position: relative;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 8px 22px;
            background: var(--green);
            box-shadow: 0 5px 12px rgba(0, 0, 0, 0.35);
        }

        header img {
            display: block;
            height: 58px;
        }

        header h1 {
            margin: 0;
            text-align: center;
            text-transform: uppercase;
            font-family: Anton, Impact, sans-serif;
            font-size: 34px;
            font-weight: normal;
            color: var(--cream);
        }

        #menuButton {
            justify-self: end;
            padding: 8px;
            border: none;
            background: none;
            cursor: pointer;
        }

        #menuButton span {
            display: block;
            width: 36px;
            height: 6px;
            margin: 6px 0;
            border-radius: 4px;
            background: var(--cream);
        }

        #menu {
            display: none;
            position: absolute;
            top: 72px;
            right: 18px;
            z-index: 5;
            min-width: 200px;
            padding: 8px;
            border-radius: 8px;
            background: var(--cream);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
        }

        #menu.open {
            display: block;
        }

        #menu a {
            display: block;
            padding: 10px 14px;
            text-transform: uppercase;
            text-decoration: none;
            font-family: Anton, Impact, sans-serif;
            font-size: 20px;
            color: var(--green);
        }

        .page {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            align-items: start;
            max-width: 1000px;
            margin: 0 auto;
            padding: 34px 20px 56px;
        }

        .right-column {
            display: grid;
            gap: 26px;
        }

        .card {
            padding: 18px 22px 24px;
            border-radius: 6px;
            background: var(--cream);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.3);
        }

        h2 {
            margin: 0;
            text-transform: uppercase;
            font-family: Anton, Impact, sans-serif;
            font-size: 42px;
            font-weight: normal;
            color: var(--green);
        }

        h3 {
            margin: 16px 0 8px;
            text-transform: uppercase;
            font-family: Anton, Impact, sans-serif;
            font-size: 24px;
            font-weight: normal;
            color: var(--green);
        }

        .desc {
            margin: 2px 0 14px;
            font-size: 11px;
            color: #7a6e60;
        }

        label {
            display: block;
            margin-bottom: 6px;
            text-transform: uppercase;
            font-family: Anton, Impact, sans-serif;
            font-size: 22px;
            color: var(--green);
        }

        input,
        select {
            width: 100%;
            padding: 8px 12px;
            border: 2px solid var(--sage);
            border-radius: 8px;
            background: var(--light);
            color: var(--brown);
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: 21px;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        .select-box {
            position: relative;
            margin-bottom: 14px;
        }

        .select-box::after {
            content: "\25BC";
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            font-size: 14px;
            color: var(--gold);
            pointer-events: none;
        }

        .two-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 18px;
        }

        .button {
            padding: 8px 32px;
            border: 2px solid var(--green);
            border-radius: 6px;
            background: var(--green);
            color: var(--cream);
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: 21px;
            cursor: pointer;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.25);
        }

        .center {
            margin-top: 14px;
            text-align: center;
        }

        .error {
            min-height: 22px;
            margin: 10px 0 0;
            color: #b04a33;
        }

        .product-box {
            padding: 6px 12px;
            border: 2px solid var(--sage);
            border-radius: 8px;
            background: var(--light);
        }

        .product-row {
            display: grid;
            grid-template-columns: 1fr auto auto auto auto;
            gap: 8px;
            align-items: center;
            padding: 2px 0;
        }

        .product-name {
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: 20px;
        }

        .product-price {
            margin-right: 6px;
            font-size: 12px;
            color: #7a6e60;
        }

        .plus,
        .minus {
            width: 26px;
            padding: 0;
            border: none;
            background: none;
            font-family: Anton, Impact, sans-serif;
            font-size: 26px;
            cursor: pointer;
        }

        .plus {
            color: var(--gold);
        }

        .minus {
            color: var(--red);
        }

        .quantity {
            min-width: 26px;
            text-align: right;
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: 22px;
            color: #bdb7a6;
        }

        .has-items {
            color: var(--green);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding-bottom: 6px;
            text-align: left;
            text-transform: uppercase;
            font-family: Anton, Impact, sans-serif;
            font-size: 19px;
            font-weight: normal;
            color: var(--green);
        }

        td {
            padding: 4px 0;
            font-family: "Bebas Neue", Impact, sans-serif;
            font-size: 17px;
        }

        .right {
            text-align: right;
        }

        .remove-button {
            border: none;
            background: none;
            color: var(--red);
            font-family: Anton, Impact, sans-serif;
            font-size: 20px;
            cursor: pointer;
        }

        .paper {
            max-width: 300px;
            margin: 12px auto 0;
            padding: 16px;
            background: white;
            color: #222222;
            font-family: "Courier New", monospace;
            font-size: 13px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .paper hr {
            border: none;
            border-top: 1px dashed #999999;
            margin: 8px 0;
        }

        .line {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .sku-line {
            font-size: 11px;
            color: #666666;
        }

        .store-name {
            font-size: 16px;
            font-weight: bold;
        }

        .total {
            font-weight: bold;
        }

        .middle {
            text-align: center;
        }

        @media (max-width: 760px) {
            .page {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 22px;
            }

            header img {
                height: 46px;
            }
        }

        @media print {
            body * {
                visibility: hidden;
            }

            .paper,
            .paper * {
                visibility: visible;
            }

            .paper {
                position: absolute;
                top: 0;
                left: 0;
                margin: 0;
                box-shadow: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <a href="sku-index.html">
            <img src="logo.png" alt="Harvest &amp; Co.">
        </a>

        <h1>Receipt Generator</h1>

        <button id="menuButton" onclick="toggleMenu()" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav id="menu">
            <a href="sku-index.html">SKU Generator</a>
            <a href="receipt-index.html">Receipt Generator</a>
        </nav>
    </header>

    <main class="page">

        <section class="card">
            <h2>Product List</h2>
            <p class="desc">Select items and print a receipt.</p>

            <label for="filter">Category</label>
            <div class="select-box">
                <select id="filter" onchange="showProducts()">
                    <option value="">All categories</option>
                    <option>Fresh Produce</option>
                    <option>Fruit</option>
                    <option>Animal Produce</option>
                    <option>Condiments &amp; Preserves</option>
                    <option>Baked Goods</option>
                    <option>Grains &amp; Pantry</option>
                    <option>Herbs &amp; Spices</option>
                </select>
            </div>

            <div id="productList"></div>
        </section>

        <div class="right-column">

            <section class="card">
                <h2>Sale Info</h2>
                <p class="desc">Input sale information and print a receipt.</p>

                <label for="payment">Mode of Payment</label>
                <div class="select-box">
                    <select id="payment" onchange="showReceipt()">
                        <option>Cash</option>
                        <option>Card</option>
                        <option>E-Wallet</option>
                    </select>
                </div>

                <div class="two-fields">
                    <div>
                        <label for="tax">Tax Rate %</label>
                        <input id="tax" type="number" min="0" value="12" oninput="showReceipt()">
                    </div>

                    <div>
                        <label for="discount">Discount %</label>
                        <input id="discount" type="number" min="0" max="100" value="0" oninput="showReceipt()">
                    </div>
                </div>

                <h2>Cart</h2>

                <div id="cart"></div>

                <div class="center">
                    <button class="button" onclick="printReceipt()">Print Receipt</button>
                </div>

                <p class="error" id="error"></p>
            </section>

            <section class="card">
                <h2>Receipt</h2>
                <div class="paper" id="receipt"></div>
            </section>

        </div>

    </main>

    <script src="receipt-main.js"></script>

</body>

</html>
